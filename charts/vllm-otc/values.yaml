# Default values for vllm-otc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: vllm/vllm-openai
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

modelName: "152334H/miqu-1-70b-sf"
gpus: 1

# Additional arguments for the main process
extraArgs: [
  "--max-model-len=32000",
]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

pv:
  cryptKeyID: ""
  exportLocation: ""
  volumeID: ""

pvc:
  cryptKeyID: ""

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector:
  "cce.cloud.com/cce-nodepool": ""

tolerations:
  - key: "gpu-node"
    operator: "Exists"
    effect: "PreferNoSchedule"

livenessProbe:
  httpGet:
    path: "/v1/models"
    port: http
    scheme: HTTP
  initialDelaySeconds: 5
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

startupProbe:
 httpGet:
   path: "/v1/models"
   port: http
   scheme: HTTP
 initialDelaySeconds: 30
 periodSeconds: 10
 failureThreshold: 60
