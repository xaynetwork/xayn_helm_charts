apiVersion: v1
kind: Service
metadata:
  name: {{ include "base-otc.fullname" . }}
  labels:
    {{- include "base-otc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.portName }}
      protocol: TCP
      name: {{ .Values.metrics.portName }}
    {{- end }}
  selector:
    {{- include "base-otc.selectorLabels" . | nindent 4 }}
