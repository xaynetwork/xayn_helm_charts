# Default values for text-extractor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

shim:
  env: []
  #  env:
  #    - name: FOO
  #      valueFrom:
  #        secretKeyRef:
  #          key: FOO
  #          name: secret-resource
  #    - name: BAR
  #      value: 42

  image:
    repository: text-extr-shim
    tag: ""
  port: 2701

  livenessProbe: {}
  readinessProbe: {}

  securityContext: {}
  resources: {}

  volumeMounts: []

main:
  env: []
#  env:
#    - name: FOO
#      valueFrom:
#        secretKeyRef:
#          key: FOO
#          name: secret-resource
#    - name: BAR
#      value: 42

  image:
    repository: tika
    tag: ""
  port: 9998
  livenessProbe: {}
  readinessProbe: {}
  securityContext: {}
  resources:
    limits:
      memory: 864Mi
    requests:
      cpu: 10m
      memory: 864Mi
  volumeMounts: []

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

nodeSelector: {}

tolerations: []

affinity: {}
